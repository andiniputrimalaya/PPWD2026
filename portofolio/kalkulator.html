<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
    <style>
        :root {
            --bg: #fdf2f8;
            --card-bg: #ffffff;
            --text: #831843;
            --border-color: #f9a8d4;
            --btn-bg: #ec4899;
            --btn-hover: #c2255c;
        }
        [data-theme="dark"] {
            --bg: #1a0f14;
            --card-bg: #241019;
            --text: #fbcfe8;
            --border-color: #46212f;
            --btn-bg: #f0629a;
            --btn-hover: #c2255c;
        }
        body{font-family: Arial, sans-serif; max-width: 400px; margin:50px auto;
    padding: 20px;background: var(--bg); transition: background 0.3s;}
        .kalkulator{background: var(--card-bg); padding: 30px; border-radius: 10px; 
    box-shadow: 0.5px 15px rgba(0,0,0,0.1);text-align: center; transition: background 0.3s;}
        .kalkulator h2 { color: var(--text); transition: color 0.3s; }
        .theme-toggle-wrap { display: flex; justify-content: space-between; align-items: center; max-width: 400px; margin: 0 auto 10px; }
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.3s;
        }
        .theme-toggle {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1.5px solid var(--border-color); background: var(--card-bg);
            font-size: 16px; cursor: pointer; padding: 0; line-height: 1;
            display: flex; align-items: center; justify-content: center;
        }
        input, button{padding:10px 15px; margin: 5px; font-size:16px; background:
     var(--btn-bg); color: white; border: none; border-radius: 5px; cursor: pointer;
     transition: background 0.3s;}
        button:hover{background: var(--btn-hover);}
        .hasil{font-size: 28px; font-weight:bold;color:var(--text); margin-top: 20px;
        transition: color 0.3s;}

    </style>
</head>
<body>
    <div class="theme-toggle-wrap">
        <a href="index.html" class="back-link">← Kembali</a>
        <button id="theme-toggle" class="theme-toggle" aria-label="Ganti mode gelap">🌙</button>
    </div>
    <div class="kalkulator">
        <h2>Kalkulator Sederhana</h2>

        <input type="number" id="angka1" placeholder="Masukkan angka pertama"><br>
        <input type="number" id="angka2" placeholder="Masukkan angka kedua">
        <br><br>

        <button onclick="tambah()">+</button>
        <button onclick="kurang()">-</button>
        <button onclick="kali()">x</button>
        <button onclick="bagi()">:</button>
        <button onclick="reset()"style="background: #e74c3c;">Reset</button>

        <div class="hasil">Hasil:<span id="hasilAngka">0</span></div>
    </div>

    <script>
        function tambah(){
            let a=parseFloat(document.getElementById('angka1').value);
            let b=parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a + b;
        }

        function kurang(){
            let a=parseFloat(document.getElementById('angka1').value);
            let b=parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a - b;
        }

        function kali(){
            let a=parseFloat(document.getElementById('angka1').value);
            let b=parseFloat(document.getElementById('angka2').value);
            document.getElementById('hasilAngka').innerText = a * b;
        }

        function bagi(){
            let a=parseFloat(document.getElementById('angka1').value);
            let b=parseFloat(document.getElementById('angka2').value);
            //Valiidasi pencegahan pembagian dengan angka 0
            if (b === 0) {
                alert("Peringatan:Tidak bisa membagi angka dengan 0!.");
                return;
            }
            document.getElementById('hasilAngka').innerText = a / b;
        }

        function reset(){
            document.getElementById('angka1').value = '';
            document.getElementById('angka2').value = '';
            document.getElementById('hasilAngka').innerText = '0';
        }
    </script>
    <script src="js/main.js"></script>
</body>
</html>
